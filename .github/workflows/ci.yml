name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --workspace --locked
      - name: test
        run: cargo test --workspace --locked -- --test-threads=4
      - name: demo smoke (unix)
        if: runner.os != 'Windows'
        run: |
          cargo build --release --locked
          (./target/release/fairlead demo > /tmp/demo.log 2>&1 &)
          sleep 6
          # the demo prints the single port it bound; everything else follows from it
          PORT=$(grep -oE 'http://127\.0\.0\.1:[0-9]+' /tmp/demo.log | head -1 | cut -d: -f3)
          test -n "$PORT" || { cat /tmp/demo.log; exit 1; }
          code() { curl -s -o /dev/null -w '%{http_code}' -H "Host: $1" "http://127.0.0.1:$PORT/"; }
          test "$(code a1.relay.test)" = 200
          test "$(code a2.relay.test)" = 200
          test "$(code nope.relay.test)" = 404
          pkill -f "fairlead demo" || true
