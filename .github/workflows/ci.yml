name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --workspace --locked
      - name: test
        run: cargo test --workspace --locked -- --test-threads=4
      - name: demo smoke (unix)
        if: runner.os != 'Windows'
        run: |
          cargo build --release --locked
          (./target/release/frplike demo > /tmp/demo.log 2>&1 &)
          sleep 6
          PORT=$(grep -o 'edge (nginx)  http://127.0.0.1:[0-9]*' /tmp/demo.log | grep -o '[0-9]*$')
          test -n "$PORT"
          curl -sf -H 'Host: a1.relay.test' "http://127.0.0.1:$PORT/" | head -1
          pkill -f "frplike demo" || true
