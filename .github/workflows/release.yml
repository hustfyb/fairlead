name: release

# Produces the five shipped binaries from one runner with cargo-zigbuild, so the
# artifacts are byte-for-byte reproducible locally with:
#
#   ./scripts/build-dist.sh && ./scripts/package.sh all
#
# Cross-compiling everything from macOS keeps the toolchain single-sourced
# (zig + rustup) instead of mixing MSVC, GNU and musl sysroots across runners.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  dist:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-apple-darwin,x86_64-apple-darwin,
            x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,
            x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2

      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - run: cargo install cargo-zigbuild --locked

      - name: build all shipped targets
        run: ./scripts/build-dist.sh

      - name: package
        run: ./scripts/package.sh all

      - name: verify artifacts
        run: |
          ls -l dist
          test -f dist/SHA256SUMS
          n=0
          for f in dist/fairlead-*.tar.gz dist/fairlead-*.zip; do n=$((n+1)); done
          test "$n" -eq 5 || { echo "expected 5 artifacts, got $n"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: fairlead-dist
          path: dist/fairlead-*
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/fairlead-*.tar.gz
            dist/fairlead-*.zip
            dist/SHA256SUMS
          generate_release_notes: true
          draft: false
