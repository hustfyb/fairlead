# Public entry + host. The host never publishes an HTTP port: only nginx does.
services:
  nginx:
    image: nginx:1.27-alpine
    depends_on: [host]
    ports:
      - "8080:8080"     # public HTTP
      - "8443:8443"     # public HTTPS (see deploy/nginx/frplike.conf)
    volumes:
      - ./nginx/frplike.conf:/etc/nginx/conf.d/frplike.conf:ro
      - ./tls:/etc/frplike/tls:ro
    restart: unless-stopped

  host:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["host", "--config", "/etc/frplike/host.toml"]
    volumes:
      - ./host.toml:/etc/frplike/host.toml:ro
      - ./tls:/etc/frplike/tls:ro
      - frplike-data:/var/lib/frplike
    ports:
      - "9443:9443"     # agents connect here
    restart: unless-stopped

volumes:
  frplike-data:
