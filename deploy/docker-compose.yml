# Public entry + host. One port is the whole surface; nginx in front is optional
# and only there to terminate TLS for it.
services:
  nginx:
    image: nginx:1.27-alpine
    depends_on: [host]
    ports:
      - "8080:8080"     # public HTTP
      - "8443:8443"     # public HTTPS (see deploy/nginx/fairlead.conf)
    volumes:
      - ./nginx/fairlead.conf:/etc/nginx/conf.d/fairlead.conf:ro
      - ./tls:/etc/fairlead/tls:ro
    restart: unless-stopped

  host:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["host", "--config", "/etc/fairlead/host.toml"]
    volumes:
      - ./host.toml:/etc/fairlead/host.toml:ro
      - ./tls:/etc/fairlead/tls:ro
      - fairlead-data:/var/lib/fairlead
    ports:
      - "9000:9000"     # the only entry: admin / tunnel / edge by Host
    restart: unless-stopped

volumes:
  fairlead-data:
