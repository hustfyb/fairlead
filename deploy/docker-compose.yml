# Public entry + host. The host never publishes an HTTP port: only nginx does.
services:
  nginx:
    image: nginx:1.27-alpine
    depends_on: [host]
    ports:
      - "8080:8080"     # public HTTP
      - "8443:8443"     # public HTTPS (see deploy/nginx/fairlead.conf)
    volumes:
      - ./nginx/fairlead.conf:/etc/nginx/conf.d/fairlead.conf:ro
      - ./tls:/etc/fairlead/tls:ro
    restart: unless-stopped

  host:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["host", "--config", "/etc/fairlead/host.toml"]
    volumes:
      - ./host.toml:/etc/fairlead/host.toml:ro
      - ./tls:/etc/fairlead/tls:ro
      - fairlead-data:/var/lib/fairlead
    ports:
      - "9443:9443"     # agents connect here
    restart: unless-stopped

volumes:
  fairlead-data:
