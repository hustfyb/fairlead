# fairlead 前面的 TLS 层：一个公网端口同时接 HTTPS、明文和 Agent 隧道
#
#   公网 :443 / :29001 ─NAT─▶ :9001 (stream + ssl_preread，见 nginx.conf.example 的 stream 段)
#                                ├─ 明文                → 127.0.0.1:9003  fairlead（字节原样透传）
#                                ├─ TLS + ALPN fairlead/1 → 127.0.0.1:9102  终结后透传（Agent 隧道）
#                                └─ 其它 TLS             → 127.0.0.1:9101  终结后按 HTTP 回源
#   管理台 :9002 (TLS) → 127.0.0.1:9004 fairlead admin
#
# fairlead 自己不做 TLS：把它挪到回环口，证书和握手都留给 nginx。
# 为什么 Agent 隧道要走 9102 而不是 9101：Agent 在 TLS 上带 ALPN `fairlead/1`，
# 而 nginx 的 http{} 只会给客户端提供 h2/http1.1，握手会以 NoApplicationProtocol
# 失败。stream 里的 `ssl_alpn` 可以原样答应这个标签，之后把明文隧道交给 host。
#
# 证书（Let's Encrypt 通配符，DNS-01，不需要 80 端口）：
#   export CF_Token=...
#   acme.sh --issue --dns dns_cf -d relay.example.com -d '*.relay.example.com'
#   acme.sh --install-cert -d relay.example.com --ecc \
#     --fullchain-file /etc/nginx/ssl/relay.example.com.fullchain.pem \
#     --key-file       /etc/nginx/ssl/relay.example.com.key.pem \
#     --reloadcmd      "nginx -s reload"

map $http_upgrade $fairlead_connection_upgrade {
    default upgrade;
    ''      close;
}

# 浏览器 / curl 的 HTTPS：终结 TLS 后按 HTTP/1.1 回源
server {
    listen 127.0.0.1:9101 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/relay.example.com.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/relay.example.com.key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:fairlead_tls:10m;
    ssl_session_timeout 1h;

    location / {
        proxy_pass http://127.0.0.1:9003;

        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;   # 合并端口上它就是「面的选择器」
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr; # 覆写，别用 $proxy_add_x_forwarded_for
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $fairlead_connection_upgrade;

        # 隧道和 CONNECT 是长连接：SSE、大文件、静默隧道都靠这两行活着
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        client_max_body_size 0;
        proxy_connect_timeout 5s;
        proxy_read_timeout 12h;
        proxy_send_timeout 12h;
    }
}

# 管理台
server {
    listen 9002 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/relay.example.com.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/relay.example.com.key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:9004;
        proxy_http_version 1.1;
        proxy_set_header Host      $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }
}

