# fairlead 前面的 TLS 层：一个公网端口只收 HTTPS（明文直接拒），管理台单独一个 TLS 口
#
#   公网 :443 / :29001 ─NAT─▶ :9001 (stream + ssl_preread，见文件末尾的 stream 段)
#                                ├─ 非 TLS（明文 http://）   → 127.0.0.1:9100  回 400 "TLS only"
#                                ├─ TLS + ALPN fairlead/1   → 127.0.0.1:9102  stream 层终结 → 9003
#                                └─ 其它 TLS                → 127.0.0.1:9101  stream 层终结 → 9003
#   管理台 :9002 (TLS) → 127.0.0.1:9004 fairlead admin
#
# fairlead 自己不做 TLS：把它挪到回环口，证书和握手都留给 nginx。
#
# 为什么两个 TLS 终结器都在 stream{} 里、而不是 http{}：
#   1) nginx 的 http 层不实现 CONNECT，会把正向代理的隧道请求直接 400 掉；
#   2) fairlead 自己就是解析 HTTP 的那一层（Host 选路、Upgrade 隧道、CONNECT、
#      绝对形式请求都归它），把解密后的字节原样转过去才是对的。
#   代价是这一口不再有 h2（客户端回落 HTTP/1.1）、也拿不到 X-Forwarded-For；
#   fairlead 需要的外网协议名由 host.toml 的 `public_scheme = "https"` 提供。
#
# 为什么 Agent 隧道仍单独走 9102：Agent 在 TLS 上带 ALPN `fairlead/1`，
# 用 `ssl_alpn fairlead/1` 原样答应这个标签，Rustls 才不会 NoApplicationProtocol。
# 想同时保留明文 HTTP（老用法）就把 stream 里 `"|"` 那条改回 127.0.0.1:9003。
#
# 证书（Let's Encrypt 通配符，DNS-01，不需要 80 端口）：
#   export CF_Token=...
#   acme.sh --issue --dns dns_cf -d relay.example.com -d '*.relay.example.com'
#   acme.sh --install-cert -d relay.example.com --ecc \
#     --fullchain-file /etc/nginx/ssl/relay.example.com.fullchain.pem \
#     --key-file       /etc/nginx/ssl/relay.example.com.key.pem \
#     --reloadcmd      "nginx -s reload"

# 管理台（唯一走 http{} 的面：它只服务浏览器，不需要 CONNECT）
server {
    listen 9002 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/relay.example.com.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/relay.example.com.key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:9004;
        proxy_http_version 1.1;
        proxy_set_header Host      $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }
}

