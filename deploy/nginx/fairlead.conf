# fairlead public entry. Include from the http {} block of nginx.conf.
#
# The two load-bearing lines:
#   proxy_set_header X-Forwarded-For $remote_addr;      # overwrite, never append
#   proxy_buffering off; proxy_request_buffering off;   # SSE + large uploads
#
# $remote_addr (not $proxy_add_x_forwarded_for): appending keeps a forged
# client header as the left-most value, and any downstream that reads the first
# entry sees the forged IP.

map $http_upgrade $fairlead_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name *.relay.example.com relay.example.com;

    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;

    client_max_body_size 0;
    proxy_connect_timeout 5s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $fairlead_connection_upgrade;

    access_log /var/log/nginx/fairlead.access.log;
    error_log  /var/log/nginx/fairlead.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:9000;
    }
}

# HTTPS: same block with
#   listen 443 ssl;
#   http2 on;
#   ssl_certificate     /etc/fairlead/tls/wildcard.crt;
#   ssl_certificate_key /etc/fairlead/tls/wildcard.key;
# and the same proxy_* lines. Nginx terminates TLS and reads Host.
