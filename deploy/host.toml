# fairlead host configuration
#
# One port, three planes. The request decides which:
#   Host: admin.<your domain>    -> admin UI        (browser)
#   Host: tunnel.<your domain>   -> tunnel plane    (agents: + Upgrade: fairlead/1)
#   anything else                -> edge plane      (site traffic, routed by Host)
#
# Leave `listen` empty to go back to three separate sockets (edge_listen,
# tunnel_listen, admin_listen) with TLS on the tunnel listener.
[server]
listen = "0.0.0.0:9000"
admin_host = "admin.relay.example.com"
tunnel_host = "tunnel.relay.example.com"

# split mode only (ignored when `listen` is set):
# edge_listen = "127.0.0.1:9000"
# tunnel_listen = "0.0.0.0:9443"
# Set `admin_listen` to serve the admin plane on its own socket instead of the
# shared port (typical: `listen` is the one mapped port, the admin UI stays on
# the LAN). `admin_host` is then unused and that name 404s on `listen`.
# admin_listen = "0.0.0.0:9001"

database = "/var/lib/fairlead/fairlead.db"
allowed_suffixes = ["relay.example.com"]
public_port = 8080
public_scheme = "http"

# TLS for the split-mode tunnel listener. The unified port terminates no TLS:
# put nginx (or any TLS terminator) in front of it and forward Host + Upgrade.
[tls]
# cert = "/etc/fairlead/tls/tunnel.crt"
# key = "/etc/fairlead/tls/tunnel.key"

[admin]
# One admin, and no username: the password is the whole credential.
# Set it at startup with FAIRLEAD_ADMIN_PASSWORD (see the systemd unit),
# or in the database with `fairlead admin passwd` — neither edits this file.
# password_hash = ""   # legacy: seeds an EMPTY database once, then ignored
session_ttl_secs = 43200
# Required when `listen` is not loopback: the admin plane shares that port.
allow_remote = true
trust_forwarded_for = false
secure_cookie = false

# The public page: what a browser gets when it opens this port by IP, or on a
# host name that cannot be a route (the apex of a suffix shows it too). It lists
# the release artifacts in `dir` and serves install.sh. Nothing on it is secret.
# Point it at the output of `scripts/package.sh`:
#   ./scripts/package.sh all && rsync -a dist/ /var/lib/fairlead/dist/
# Leave it out and an unknown host keeps answering 400/404.
# A name of its own turns the page into something you can hand out: the
# wildcard record for an allowed suffix already points here, so `app.<suffix>`
# works as-is. That name always answers the page, even though it looks like a
# site, and it wins over a route that claims it.
# [landing]
# dir = "/var/lib/fairlead/dist"
# host = "app.relay.example.com"

# Forward-proxy passthrough, off unless `route` is set. Browsers and curl send
# `GET http://target/ ...` or `CONNECT target:443` when this port is configured
# as their proxy; the destination sits in `Host`, so no site route can match it
# and the relay used to answer its own 404. `route` names the one route that
# answers such requests instead — a real route, declared by an agent, whose
# target is a forward proxy on that machine (xray / mihomo / squid / privoxy).
# The relay only splices bytes, which is why HTTPS needs no CONNECT support.
#
# Never leave this open: set `auth`, or `allow_from`, or both.
# [proxy]
# route = "muse"                     # short form -> muse.<first allowed suffix>
# auth = "user:password"            # Proxy-Authorization: Basic
# allow_from = ["192.168.1.0/24"]
# idle_timeout_secs = 0              # 0 = a quiet CONNECT tunnel is left alone
