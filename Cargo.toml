[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/hustfyb/fairlead"
homepage = "https://github.com/hustfyb/fairlead#readme"
authors = ["rain <hustfyb@users.noreply.github.com>"]

[workspace.dependencies]
anyhow = "1"
arc-swap = "1"
argon2 = "0.5"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
hex = "0.4"
httparse = "1"
rand = "0.8"
rcgen = "0.13"
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "time",
  "sync",
  "signal",
  "fs",
  "process",
] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-util = { version = "0.7", features = ["compat"] }
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "tracing-log"] }
uuid = { version = "1", features = ["v4"] }
webpki-roots = "1"
yamux = "0.13"

fairlead-proto = { path = "crates/fairlead-proto" }
fairlead-host = { path = "crates/fairlead-host" }
fairlead-agent = { path = "crates/fairlead-agent" }
fairlead-testkit = { path = "crates/fairlead-testkit" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
debug = 1
